name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install flake8
        run: pip install flake8==7.1.1

      - name: Lint Python
        run: flake8 app.py --max-line-length=100

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build-scan:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1" # fail the job on critical/high findings
          ignore-unfixed: true

  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Generate placeholder Secret for kustomize build
        run: |
          kubectl create secret generic payments-api-secrets \
            --namespace payments-api \
            --from-literal=DATABASE_URL='postgresql://placeholder:placeholder@localhost:5432/payments' \
            --dry-run=client -o yaml > k8s/secret.yaml

      - name: Build manifests with kustomize
        run: kubectl kustomize k8s/ > /tmp/rendered.yaml

      - name: Validate against Kubernetes schemas
        run: kubeconform -strict -summary /tmp/rendered.yaml

  push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: [build-scan, validate-k8s]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ needs.build-scan.outputs.image_name }}:${{ needs.build-scan.outputs.image_tag }}
            ${{ needs.build-scan.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
