# Original manifest as supplied by the colleague — kept for reference only,
# do not apply. See fixed-deployment.yaml and incident-note.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments-api
          image: payments-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
          resources:
            limits:
              memory: "16Mi"
              cpu: "50m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
spec:
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 80
