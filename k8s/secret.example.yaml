# human ever runs `kubectl create secret` against production.
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secrets
  namespace: payments-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/payments"
