apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments-api
  labels:
    app: payments-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments-api
          image: ghcr.io/example-org/payments-api:latest # overridden per-deploy with the commit SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-api-secrets
                  key: DATABASE_URL
          resources:
            # Idle baseline measured at ~51Mi on a kind cluster. A 64Mi
            # request left the memory HPA trigger (80% of request) hugging
            # actual usage and firing on noise, so the request is set with
            # real headroom above the observed baseline instead.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Gives kube-proxy/endpoint controllers time to remove this
                # pod from the Service before the process actually stops,
                # closing a race that otherwise drops ~1-2% of requests
                # during a rollout (observed while load-testing this exact
                # manifest against a kind cluster).
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payments-api
